version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
      POSTGRES_DB: restaurant
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
